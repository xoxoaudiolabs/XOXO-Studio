# The Pocket's sound over the link (Ethernet, or Wi-Fi), into the Studio: PipeWire's RTP receiver on UDP 46000,
# plain RTP L16 (S16BE, 48 kHz, stereo), as the Pocket's rtp-sink sends it while linked. A source, fm1-pocket:
# POCKET in the Studio's HOME, MIXER and recordings while a Pocket is linked (bridge.py). Run on its own by
# fm1-pocket-in.service (pipewire -c this file), so PipeWire itself never restarts for it. The receiver config is
# the Pocket session's (netaudio.receiver_config() in FM-1-Companion, GPL-3.0); the 40 ms latency is a first
# guess, to be tuned by ear.
context.properties = { core.daemon = false core.name = fm1-pocket-link }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-rtp-source
    args = {
      source.ip = "0.0.0.0"
      source.port = 46000
      sess.latency.msec = 40
      sess.ignore-ssrc = true          # a Pocket's sender restarted (a new SSRC) is still heard
      sess.media = "audio"
      stream.props = { node.name = "fm1-pocket" node.description = "Pocket (link)" media.class = "Audio/Source" }
      audio.format = "S16BE"
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
    }
  }
]
