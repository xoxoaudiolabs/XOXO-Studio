# The Pocket's sound over the link (Ethernet, or Wi-Fi), into the Studio: PipeWire's RTP receiver on UDP 46000,
# plain RTP L16 (S16BE, 48 kHz, stereo), as the Pocket's rtp-sink sends it while linked. A source, fm1-pocket:
# POCKET in the Studio's HOME, MIXER and recordings while a Pocket is linked (bridge.py). Run on its own by
# fm1-pocket-in.service (pipewire -c this file), so PipeWire itself never restarts for it. The receiver config is
# the Pocket session's (netaudio.receiver_config() in FM-1-Companion, GPL-3.0); the 40 ms latency is a first
# guess, to be tuned by ear.
# A Pocket that knows this Studio splits its FM-1s (the Studio's /api/status says "pocket_fm1s"): POCKET is then
# the rest of its mix, and each of its FM-1s (A-C, by USB port) comes on a stream of its own, UDP 46002 / 46004 /
# 46006 -> fm1-pocket-a/b/c, in the same format (one PipeWire for all four, as the Pocket's senders are one).
# A Studio following this one (Follow Studio) sends its mix to UDP 46020 -> xoxo-studio-in: STUDIO, beside a Pocket.
context.properties = { core.daemon = false core.name = fm1-pocket-link }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-rtp-source
    args = {
      source.ip = "0.0.0.0"
      source.port = 46000
      sess.latency.msec = 44
      sess.ignore-ssrc = true          # a Pocket's sender restarted (a new SSRC) is still heard
      sess.media = "audio"
      stream.props = { node.name = "fm1-pocket" node.description = "Pocket (link)" media.class = "Audio/Source" }
      audio.format = "S16BE"
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
    }
  }
  { name = libpipewire-module-rtp-source
    args = {
      source.ip = "0.0.0.0"
      source.port = 46002
      sess.latency.msec = 44
      sess.ignore-ssrc = true
      sess.media = "audio"
      stream.props = { node.name = "fm1-pocket-a" node.description = "Pocket FM-1 A" media.class = "Audio/Source" }
      audio.format = "S16BE"
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
    }
  }
  { name = libpipewire-module-rtp-source
    args = {
      source.ip = "0.0.0.0"
      source.port = 46004
      sess.latency.msec = 44
      sess.ignore-ssrc = true
      sess.media = "audio"
      stream.props = { node.name = "fm1-pocket-b" node.description = "Pocket FM-1 B" media.class = "Audio/Source" }
      audio.format = "S16BE"
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
    }
  }
  { name = libpipewire-module-rtp-source
    args = {
      source.ip = "0.0.0.0"
      source.port = 46006
      sess.latency.msec = 44
      sess.ignore-ssrc = true
      sess.media = "audio"
      stream.props = { node.name = "fm1-pocket-c" node.description = "Pocket FM-1 C" media.class = "Audio/Source" }
      audio.format = "S16BE"
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
    }
  }
  { name = libpipewire-module-rtp-source
    args = {
      source.ip = "0.0.0.0"
      source.port = 46020
      sess.latency.msec = 44
      sess.ignore-ssrc = true
      sess.media = "audio"
      stream.props = { node.name = "xoxo-studio-in" node.description = "Studio following (link)" media.class = "Audio/Source" }
      audio.format = "S16BE"
      audio.rate = 48000
      audio.channels = 2
      audio.position = [ FL FR ]
    }
  }
]
