# The Studio's Ethernet straight to the Pocket (no router): a link-local address (169.254.x.x), so the Pocket
# finds the Studio's network MIDI over mDNS. On a network with a router, it gets its DHCP address as well.
# (NetworkManager's default for every wired connection that doesn't set its own; install.sh puts it in
# /etc/NetworkManager/conf.d/)
[connection-fm1-ethernet-link]
match-device=type:ethernet
ipv4.link-local=enabled
