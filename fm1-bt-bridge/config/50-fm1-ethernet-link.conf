# The Studio's Ethernet straight to the Pocket (no router): a link-local address (169.254.x.x), so the Pocket
# finds the Studio's network MIDI over mDNS. On a network with a router, it gets its DHCP address as well.
# (NetworkManager's default for every wired connection that doesn't set its own; install.sh puts it in
# /etc/NetworkManager/conf.d/. Its defaults are numbers: link-local 3 is "enabled".) DHCP never gives up: on a
# bare cable, NetworkManager 1.52 otherwise failed the whole connection after its timeout and took the link-local
# address with it (found on the Pocket); eth0 stays "getting IP configuration", with its link-local address
# working.
[connection-fm1-ethernet-link]
match-device=type:ethernet
ipv4.link-local=3
ipv4.dhcp-timeout=2147483647
